name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  template-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test template structure
        run: |
          # Claude Code template
          test -f template/claude/CLAUDE.md
          test -f template/claude/settings.json
          test -f template/claude/MEMORY.md
          test -f template/claude/hooks/session-start.sh
          test -f template/claude/hooks/stop.sh
          test -f template/claude/hooks/export-system.sh
          test -f template/claude/hooks/pre-tool-use.sh
          test -f template/claude/hooks/post-tool-use.sh
          test -f template/claude/hooks/pre-compact.sh
          test -f template/claude/hooks/dotenv-append.sh
          test -f template/claude/rules/security.md
          test -f template/claude/rules/coding.md
          test -f template/claude/rules/core-invariants.md
          test -f template/claude/agents/architect.md
          test -f template/claude/agents/reviewer.md
          test -f template/claude/commands/boot.md
          test -f template/claude/commands/evolve.md
          test -f template/claude/commands/review.md
          test -f template/claude/memory/README.md
          test -f template/claude/skills/README.md
          test -f template/claude/skills/debug/SKILL.md
          test -f template/claude/skills/code-review/SKILL.md
          test -f template/claude/skills/learning-recorder/SKILL.md

          # Codex CLI template
          test -f template/codex/AGENTS.md
          test -f template/codex/hooks.json
          test -f template/codex/hooks-scripts/session-start.sh
          test -f template/codex/hooks-scripts/stop.sh
          test -f template/codex/hooks-scripts/pre-tool-use.sh

          # OpenCode CLI template
          test -f template/opencode/AGENTS.md
          test -f template/opencode/opencode.json
          test -f template/opencode/tools/evokit-boot.ts
          test -f template/opencode/tools/evokit-evolve.ts
          test -f template/opencode/tools/evokit-memory.ts
          test -f template/opencode/tools/evokit-session.ts
          test -f template/opencode/agents/architect.md
          test -f template/opencode/agents/reviewer.md

      - name: Check no personal paths in template
        run: |
          ! grep -r "hpee2" template/ 2>/dev/null || false
          ! grep -r "/home/" template/claude/settings.json 2>/dev/null || false

      - name: Shellcheck hooks
        run: |
          shellcheck template/claude/hooks/*.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build CLI
        run: npm run build
      - name: Test dry-run install
        run: |
          bash bin/install.sh --dry-run

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck all scripts
        run: |
          shellcheck bin/*.sh
          shellcheck template/claude/hooks/*.sh
          shellcheck template/codex/hooks-scripts/*.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f CHANGELOG.md
          # English docs
          test -f docs/en/ARCHITECTURE.md
          test -f docs/en/EVOLUTION.md
          test -f docs/en/INSTALL.md
          test -f docs/en/MIGRATION.md
          test -f docs/en/CUSTOMIZE.md
          test -f docs/en/FAQ.md
          test -f docs/en/MULTI_AGENT.md
          test -f docs/en/HOMEBREW.md
          # Chinese docs
          test -f docs/zh/ARCHITECTURE.md
          test -f docs/zh/EVOLUTION.md
          test -f docs/zh/INSTALL.md
          test -f docs/zh/MIGRATION.md
          test -f docs/zh/CUSTOMIZE.md
          test -f docs/zh/FAQ.md
          test -f docs/zh/MULTI_AGENT.md
          test -f docs/zh/HOMEBREW.md

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Verify CLI
        run: node bin/evokit.cjs --help
