name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  template-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test template structure
        run: |
          # Claude Code template
          test -f template/claude/CLAUDE.md
          test -f template/claude/MEMORY.md
          test -f template/claude/hooks/session-start.sh
          test -f template/claude/hooks/stop.sh
          test -f template/claude/rules/security.md
          test -f template/claude/rules/coding.md
          test -f template/claude/rules/core-invariants.md
          test -f template/claude/agents/architect.md
          test -f template/claude/agents/reviewer.md
          test -f template/claude/commands/evokit-boot.md
          test -f template/claude/commands/evokit-learn.md
          test -f template/claude/commands/evokit-review.md
          test -f template/claude/skills/README.md
          # Claude v1.0 知识库结构
          test -f template/claude/memory/evokit/knowledge-index.md
          test -f template/claude/memory/evokit/knowledge/.gitkeep
          test -f template/claude/memory/evokit/.pending/.gitkeep

          # Codex CLI template
          test -f template/codex/AGENTS.md
          test -f template/codex/hooks.json
          test -f template/codex/hooks-scripts/session-start.sh
          test -f template/codex/hooks-scripts/stop.sh
          # Codex v1.0 知识库结构
          test -f template/codex/memory/evokit/knowledge-index.md
          test -f template/codex/memory/evokit/knowledge/.gitkeep
          test -f template/codex/memory/evokit/.pending/.gitkeep

          # OpenCode CLI template
          test -f template/opencode/AGENTS.md
          test -f template/opencode/opencode.json
          test -f template/opencode/tools/evokit-boot.ts
          test -f template/opencode/tools/evokit-learn.ts
          test -f template/opencode/tools/evokit-session.ts
          # OpenCode v1.0 知识库结构
          test -f template/opencode/memory/evokit/knowledge-index.md
          test -f template/opencode/memory/evokit/knowledge/.gitkeep
          test -f template/opencode/memory/evokit/.pending/.gitkeep

          # Pi CLI template
          test -f template/pi/AGENTS.md
          test -f template/pi/extensions/evokit-lifecycle.ts
          test -f template/pi/extensions/evokit-boot.ts
          test -f template/pi/extensions/evokit-learn.ts
          # Pi v1.0 知识库结构
          test -f template/pi/memory/evokit/knowledge-index.md
          test -f template/pi/memory/evokit/knowledge/.gitkeep
          test -f template/pi/memory/evokit/.pending/.gitkeep

      - name: Check no personal paths in template
        run: |
          ! grep -r "hpee2" template/ 2>/dev/null || false

      - name: Shellcheck hooks
        run: |
          shellcheck template/claude/hooks/*.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build CLI
        run: npm run build
      - name: Test dry-run install
        run: |
          bash bin/install.sh --dry-run

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck all scripts
        run: |
          shellcheck bin/*.sh
          shellcheck template/claude/hooks/*.sh
          shellcheck template/codex/hooks-scripts/*.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f CHANGELOG.md
          test -f ROADMAP.md
          # English docs
          test -f docs/en/ARCHITECTURE.md
          test -f docs/en/KNOWLEDGE.md
          test -f docs/en/INSTALL.md
          test -f docs/en/MIGRATION.md
          test -f docs/en/CUSTOMIZE.md
          test -f docs/en/FAQ.md
          test -f docs/en/MULTI_AGENT.md
          test -f docs/en/HOMEBREW.md
          # Chinese docs
          test -f docs/zh/ARCHITECTURE.md
          test -f docs/zh/KNOWLEDGE.md
          test -f docs/zh/INSTALL.md
          test -f docs/zh/MIGRATION.md
          test -f docs/zh/CUSTOMIZE.md
          test -f docs/zh/FAQ.md
          test -f docs/zh/MULTI_AGENT.md
          test -f docs/zh/HOMEBREW.md

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Verify CLI
        run: node bin/evokit.cjs --help
